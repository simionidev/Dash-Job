name: CI
# test: validando pipeline de CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # BACKEND — NestJS
  # ─────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashjob
          POSTGRES_PASSWORD: dashjob
          POSTGRES_DB: dashjob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/backend
        run: npm run lint

      - name: Type check
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dashjob:dashjob@localhost:5432/dashjob_test

      - name: Run migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dashjob:dashjob@localhost:5432/dashjob_test

      - name: Run unit tests
        working-directory: apps/backend
        run: npm run test -- --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://dashjob:dashjob@localhost:5432/dashjob_test
          JWT_SECRET: ci-secret-for-tests
          JWT_REFRESH_SECRET: ci-refresh-secret-for-tests

      - name: Build
        working-directory: apps/backend
        run: npm run build

  # ─────────────────────────────────────────
  # FRONTEND WEB — Next.js 15
  # ─────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  # ─────────────────────────────────────────
  # MOBILE — React Native / Expo
  # ─────────────────────────────────────────
  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        working-directory: apps/mobile
        run: npx expo-doctor
        continue-on-error: true

  # ─────────────────────────────────────────
  # DOCKER BUILD — valida as imagens
  # ─────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # STATUS — gate final para proteger a branch
  # ─────────────────────────────────────────
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend, web, mobile, docker]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
