name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # BUILD & PUSH — imagens para ghcr.io
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dashjob-backend:latest
            ghcr.io/${{ github.repository_owner }}/dashjob-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dashjob-web:latest
            ghcr.io/${{ github.repository_owner }}/dashjob-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # DEPLOY — SSH no VPS
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CR_PAT,GITHUB_ACTOR
          script: |
            set -e

            cd /opt/dashjob

            # Autentica no registry
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Puxa as novas imagens e reinicia os serviços
            docker compose -f docker-compose.prod.yml pull backend web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove imagens antigas para liberar espaço
            docker image prune -f

            echo "Deploy concluído: $(date)"
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
